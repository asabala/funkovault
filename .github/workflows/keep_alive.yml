name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 9 * * 2,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"